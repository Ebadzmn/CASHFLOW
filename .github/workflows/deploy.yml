name: CashFlow CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_BACKEND: ghcr.io/ebadzmn/cashflow-backend
  IMAGE_ADMIN: ghcr.io/ebadzmn/cashflow-admin
  TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 0: Bootstrap EC2 server (idempotent — safe to run every push)
  # Installs swap, Docker, Nginx, MongoDB, backup cron on first run.
  # Skips everything already done on subsequent pushes.
  # ─────────────────────────────────────────────────────────────────
  setup-server:
    name: 🖥️ Bootstrap EC2 Server
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            # ── Swap file (only if not already set up) ────────────────
            if ! swapon --show | grep -q swapfile; then
              echo "Setting up 2GB swap file..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "✅ Swap file created"
            else
              echo "✅ Swap file already exists — skipping"
            fi

            # ── Docker (only if not installed) ────────────────────────
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker ubuntu
              echo "✅ Docker installed"
            else
              echo "✅ Docker already installed — skipping"
            fi

            # ── Nginx + Certbot (only if not installed) ───────────────
            if ! command -v nginx &>/dev/null; then
              echo "Installing Nginx + Certbot..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq nginx certbot python3-certbot-nginx
              echo "✅ Nginx + Certbot installed"
            else
              echo "✅ Nginx already installed — skipping"
            fi

            # ── App directories ───────────────────────────────────────
            mkdir -p ~/cashflow/scripts
            sudo mkdir -p /var/lib/cashflow-mongo /var/backups/cashflow-mongo
            sudo chown -R 999:999 /var/lib/cashflow-mongo 2>/dev/null || true
            sudo chown -R ubuntu:ubuntu /var/backups/cashflow-mongo

            # ── Internal Docker network ───────────────────────────────
            sudo docker network create cashflow-net 2>/dev/null || true

            # ── MongoDB container (only if not running) ───────────────
            if ! sudo docker ps --format '{{.Names}}' | grep -q cashflow-mongo; then
              echo "Starting MongoDB container..."
              sudo docker run -d \
                --name cashflow-mongo \
                --restart always \
                --network cashflow-net \
                -p 127.0.0.1:27017:27017 \
                -v /var/lib/cashflow-mongo:/data/db \
                -e MONGO_INITDB_ROOT_USERNAME=cashflowAdmin \
                -e MONGO_INITDB_ROOT_PASSWORD=Shakayet1211879404 \
                -e MONGO_INITDB_DATABASE=cashflow \
                mongo:7.0 --wiredTigerCacheSizeGB 0.25
              echo "✅ MongoDB started"
            else
              echo "✅ MongoDB already running — skipping"
            fi

            # ── Nginx config (write/overwrite on every push so it stays current) ──
            sudo tee /etc/nginx/sites-available/cashflow > /dev/null << 'NGINXEOF'
            server {
                listen 80;
                server_name api.mycashflowiq.com;

                location / {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }

            server {
                listen 80;
                server_name admin.mycashflowiq.com;

                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINXEOF

            sudo ln -sf /etc/nginx/sites-available/cashflow /etc/nginx/sites-enabled/cashflow
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl enable nginx && sudo systemctl reload nginx
            echo "✅ Nginx config applied"

            # ── Daily backup script ───────────────────────────────────
            cat > ~/cashflow/scripts/backup-db.sh << 'EOF'
            #!/bin/bash
            set -e
            BACKUP_DIR="/var/backups/cashflow-mongo"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="cashflow_backup_${TIMESTAMP}.gz"
            mkdir -p "$BACKUP_DIR"
            sudo docker exec cashflow-mongo mongodump \
              --username cashflowAdmin \
              --password Shakayet1211879404 \
              --authenticationDatabase admin \
              --db cashflow \
              --archive --gzip > "${BACKUP_DIR}/${BACKUP_FILE}"
            find "$BACKUP_DIR" -type f -name "cashflow_backup_*.gz" -mtime +7 -delete
            echo "[$(date)] Backup: ${BACKUP_FILE} ($(du -h "${BACKUP_DIR}/${BACKUP_FILE}" | cut -f1))"
            EOF
            chmod +x ~/cashflow/scripts/backup-db.sh

            # ── Restore script ────────────────────────────────────────
            cat > ~/cashflow/scripts/restore-db.sh << 'EOF'
            #!/bin/bash
            set -e
            BACKUP_FILE="$1"
            [ -z "$BACKUP_FILE" ] && { echo "Usage: ./restore-db.sh <backup.gz>"; exit 1; }
            sudo docker exec -i cashflow-mongo mongorestore \
              --username cashflowAdmin \
              --password Shakayet1211879404 \
              --authenticationDatabase admin \
              --drop --archive --gzip < "$BACKUP_FILE"
            echo "✅ Database restored from: $BACKUP_FILE"
            EOF
            chmod +x ~/cashflow/scripts/restore-db.sh

            # ── Cron job for nightly backups at 2:00 AM UTC ───────────
            (crontab -l 2>/dev/null | grep -v "backup-db.sh"; echo "0 2 * * * /home/ubuntu/cashflow/scripts/backup-db.sh >> /var/log/cashflow-backup.log 2>&1") | crontab -

            echo "✅ Server bootstrap complete!"

  # ─────────────────────────────────────────────────────────────────
  # JOB 1: TypeScript type-check (runs in parallel with setup-server)
  # ─────────────────────────────────────────────────────────────────
  type-check:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm ci
        working-directory: apps/backend

      - name: Install admin deps
        run: npm ci
        working-directory: apps/admin

      - name: Type-check backend
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Type-check admin
        run: npx tsc --noEmit
        working-directory: apps/admin

  # ─────────────────────────────────────────────────────────────────
  # JOB 2a: Build & push Backend Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────
  build-backend:
    name: 🏗️ Build Backend
    needs: type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.TAG }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 2b: Build & push Admin Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────
  build-admin:
    name: 🏗️ Build Admin
    needs: type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Admin
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: true
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ env.TAG }}
            ${{ env.IMAGE_ADMIN }}:latest
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://api.mycashflowiq.com/api/v1
            NEXT_PUBLIC_API_URL=https://api.mycashflowiq.com/api/v1
            NEXT_PUBLIC_SOCKET_URL=https://api.mycashflowiq.com
            NEXTAUTH_URL=https://admin.mycashflowiq.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 2c: Build Flutter APK (artifact only — no EC2 deploy)
  # ─────────────────────────────────────────────────────────────────
  build-flutter:
    name: 📱 Build Flutter APK
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build APK (release)
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-apk-${{ env.TAG }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Blue/Green deploy — waits for BOTH setup-server AND builds
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2 (mycashflowiq.com)
    needs: [setup-server, build-backend, build-admin]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (Blue/Green)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_BACKEND,IMAGE_ADMIN,TAG,GITHUB_TOKEN,GITHUB_ACTOR
          command_timeout: 10m
          script: |
            set -e
            cd ~/cashflow

            # ── Write env from single secret, split by section ────────
            cat > .env.raw << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            sed -n '/backned start/,/backned end/p' .env.raw > .env.backend
            [ ! -s .env.backend ] && cp .env.raw .env.backend

            sed -n '/admin start/,/admin end/p' .env.raw > .env.admin
            [ ! -s .env.admin ] && cp .env.raw .env.admin

            # Auto-fix: containers connect to mongo via Docker network name
            sed -i 's|@localhost:27017|@cashflow-mongo:27017|g' .env.backend
            sed -i 's|@127.0.0.1:27017|@cashflow-mongo:27017|g' .env.backend

            chmod 600 .env.backend .env.admin .env.raw

            # ── Login to GHCR ─────────────────────────────────────────
            echo "${GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # ── Pull new images ───────────────────────────────────────
            sudo docker pull ${IMAGE_BACKEND}:${TAG}
            sudo docker pull ${IMAGE_ADMIN}:${TAG}

            # ── Ensure internal network exists ────────────────────────
            sudo docker network create cashflow-net 2>/dev/null || true

            # ── GREEN: start on alternate ports ──────────────────────
            sudo docker rm -f cashflow-backend-green cashflow-admin-green 2>/dev/null || true

            sudo docker run -d \
              --name cashflow-backend-green \
              --network cashflow-net \
              --env-file .env.backend \
              -p 5001:5000 \
              --health-cmd 'node -e "fetch(\"http://127.0.0.1:5000/health/live\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"' \
              --health-interval 10s \
              --health-retries 6 \
              --health-start-period 20s \
              ${IMAGE_BACKEND}:${TAG}

            sudo docker run -d \
              --name cashflow-admin-green \
              --network cashflow-net \
              --env-file .env.admin \
              -p 3002:3001 \
              ${IMAGE_ADMIN}:${TAG}

            # ── Wait for backend health check ─────────────────────────
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 18); do
              STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' cashflow-backend-green 2>/dev/null || echo "starting")
              echo "  Health: $STATUS ($i/18)"
              [ "$STATUS" = "healthy" ] && break
              [ $i -eq 18 ] && {
                echo "❌ Backend failed health check. Rolling back."
                sudo docker rm -f cashflow-backend-green cashflow-admin-green 2>/dev/null || true
                exit 1
              }
              sleep 5
            done
            echo "✅ Backend healthy!"

            # ── Switch Nginx to green ─────────────────────────────────
            sudo sed -i 's|proxy_pass http://127.0.0.1:5000|proxy_pass http://127.0.0.1:5001|' /etc/nginx/sites-available/cashflow
            sudo sed -i 's|proxy_pass http://127.0.0.1:3001|proxy_pass http://127.0.0.1:3002|' /etc/nginx/sites-available/cashflow
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx switched to green"

            # ── Kill old blue containers ──────────────────────────────
            sudo docker rm -f cashflow-backend-blue cashflow-admin-blue 2>/dev/null || true

            # ── Promote green → blue (production ports) ───────────────
            sudo docker stop cashflow-backend-green && sudo docker rm cashflow-backend-green
            sudo docker stop cashflow-admin-green   && sudo docker rm cashflow-admin-green

            sudo docker run -d --name cashflow-backend-blue --restart unless-stopped \
              --network cashflow-net \
              --env-file .env.backend \
              -p 5000:5000 \
              ${IMAGE_BACKEND}:${TAG}

            sudo docker run -d --name cashflow-admin-blue --restart unless-stopped \
              --network cashflow-net \
              --env-file .env.admin \
              -p 3001:3001 \
              ${IMAGE_ADMIN}:${TAG}

            # ── Reset Nginx ports back to production ──────────────────
            sudo sed -i 's|proxy_pass http://127.0.0.1:5001|proxy_pass http://127.0.0.1:5000|' /etc/nginx/sites-available/cashflow
            sudo sed -i 's|proxy_pass http://127.0.0.1:3002|proxy_pass http://127.0.0.1:3001|' /etc/nginx/sites-available/cashflow
            sudo nginx -t && sudo systemctl reload nginx

            # ── Cleanup old images ────────────────────────────────────
            sudo docker image prune -f --filter "until=24h"
            rm -f .env.raw

            echo "✅ Deploy complete — ${TAG}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: SSL — runs after deploy, idempotent (safe to run every push)
  # Installs free HTTPS via Let's Encrypt. Skips if cert already exists.
  # ─────────────────────────────────────────────────────────────────
  ssl-setup:
    name: 🔒 SSL Setup (Let's Encrypt)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Issue or renew SSL via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Check if cert already exists and is valid
            if sudo certbot certificates 2>/dev/null | grep -q "api.mycashflowiq.com"; then
              echo "✅ SSL certificate already exists — skipping issuance"
              # Attempt renewal if close to expiry (safe, no-op if not needed)
              sudo certbot renew --quiet --no-self-upgrade 2>/dev/null || true
            else
              echo "Issuing Let's Encrypt SSL certificates..."
              sudo certbot --nginx \
                -d api.mycashflowiq.com \
                -d admin.mycashflowiq.com \
                --non-interactive \
                --agree-tos \
                -m shakayet.dev@gmail.com \
                --redirect
              echo "✅ SSL certificates issued — HTTPS is now live!"
            fi
